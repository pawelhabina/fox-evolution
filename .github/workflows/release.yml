name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and release threshold
        shell: pwsh
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME.replace(/^v/, ''); const [major,minor]=p.version.split('.').map(Number); if(tag!==p.version) throw new Error('Tag '+tag+' does not match package version '+p.version); if(major<1 || (major===1 && minor<2)) throw new Error('GitHub Releases start at version 1.2.0');"

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Build Windows installer
        run: npm run build:win

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "dist/Fox-Evolution-$version-x64.exe"
          gh release create $env:GITHUB_REF_NAME $installer "$installer.blockmap" "dist/latest.yml" --verify-tag --title "Fox Evolution $version" --generate-notes --latest
